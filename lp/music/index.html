<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0e1024">
<meta name="description" content="ループを重ねて曲を作る、子供向けの音楽づくりアプリ">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="ループでおんがく">
<link rel="manifest" href="./manifest.json">
<link rel="icon" href="./icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="./icon-192.png">
<title>ループでおんがく</title>
<style>
:root{
  --bg:#0e1024;
  --bg2:#191d42;
  --panel:#191d42;
  --line:#2e3568;
  --txt:#eef1ff;
  --muted:#98a1d8;
  --beat:0.6s;
  --gap:clamp(6px,1.1vmin,12px);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0;overflow:hidden;overscroll-behavior:none}
body{
  background-color:var(--bg);
  background-image:radial-gradient(120% 100% at 50% 0%,#1b2050 0%,var(--bg) 60%,#080a19 100%);
  color:var(--txt);
  font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Hiragino Kaku Gothic ProN","Noto Sans JP","Yu Gothic",system-ui,sans-serif;
  touch-action:manipulation;
  user-select:none;-webkit-user-select:none;
}
button{font-family:inherit;color:inherit;border:0;background:none;touch-action:manipulation;cursor:pointer}

/* ---------- レイアウト ---------- */
#app{
  position:fixed;inset:0;
  display:flex;flex-direction:column;
  gap:var(--gap);
  padding:calc(var(--gap) + env(safe-area-inset-top)) calc(var(--gap) + env(safe-area-inset-right)) calc(var(--gap) + env(safe-area-inset-bottom)) calc(var(--gap) + env(safe-area-inset-left));
}

/* ---------- 上部バー ---------- */
header{
  display:flex;align-items:center;gap:var(--gap);flex-wrap:wrap;
  background:linear-gradient(180deg,rgba(255,255,255,.07),rgba(255,255,255,.02));
  border:1px solid var(--line);border-radius:18px;
  padding:calc(var(--gap)*.8) var(--gap);
}
.btn{
  display:flex;align-items:center;justify-content:center;
  min-width:64px;height:clamp(44px,7vh,58px);
  padding:0 16px;border-radius:14px;
  background:rgba(255,255,255,.08);border:1px solid var(--line);
  font-size:clamp(20px,3.2vh,26px);line-height:1;
}
.btn:active{transform:scale(.95)}
#play{background:linear-gradient(180deg,#3ddc97,#1fa96f);border-color:#5cf0b0;color:#06231a;font-weight:700;box-shadow:0 6px 18px rgba(61,220,151,.28)}
#play.playing{background:linear-gradient(180deg,#ffd166,#f0a93c);border-color:#ffe29a;color:#2a1a00;box-shadow:0 6px 18px rgba(255,209,102,.28)}
#play.waiting{animation:blink calc(var(--beat)*2) ease-in-out infinite}
.tempo{
  display:flex;align-items:center;gap:10px;flex:1 1 220px;min-width:180px;
  background:rgba(0,0,0,.22);border:1px solid var(--line);border-radius:14px;
  padding:6px 12px;height:clamp(44px,7vh,58px);
}
.tempo .ico{font-size:clamp(16px,2.4vh,22px);opacity:.85}
#bpmv{font-variant-numeric:tabular-nums;font-weight:700;font-size:clamp(14px,2.2vh,19px);min-width:3.2em;text-align:right;color:#ffd166}
input[type=range]{
  -webkit-appearance:none;appearance:none;flex:1;height:26px;background:transparent;margin:0;
}
input[type=range]::-webkit-slider-runnable-track{height:10px;border-radius:6px;background:linear-gradient(90deg,#5ec5ff,#a78bfa)}
input[type=range]::-moz-range-track{height:10px;border-radius:6px;background:linear-gradient(90deg,#5ec5ff,#a78bfa)}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;appearance:none;width:30px;height:30px;margin-top:-10px;border-radius:50%;background:#fff;border:3px solid #5ec5ff;box-shadow:0 2px 8px rgba(0,0,0,.45)}
input[type=range]::-moz-range-thumb{width:26px;height:26px;border-radius:50%;background:#fff;border:3px solid #5ec5ff}

/* ---------- 拍インジケータ ---------- */
.beats{
  display:flex;gap:clamp(8px,1.4vw,14px);align-items:center;justify-content:center;
  height:clamp(44px,7vh,58px);padding:0 clamp(12px,1.6vw,20px);
  background:rgba(0,0,0,.22);border:1px solid var(--line);border-radius:14px;
}
.beats i{
  width:clamp(13px,2.4vh,20px);height:clamp(13px,2.4vh,20px);border-radius:50%;
  background:rgba(255,255,255,.16);border:1px solid rgba(255,255,255,.22);
  transition:transform .08s ease-out,background-color .12s ease-out,box-shadow .12s ease-out;
}
.beats i.hit{background:#fff;box-shadow:0 0 14px rgba(255,255,255,.85);transform:scale(1.45)}
.beats i.one.hit{background:#ffd166;box-shadow:0 0 16px rgba(255,209,102,.9)}

/* ---------- グリッド ---------- */
main{flex:1 1 auto;min-height:0;overflow:auto;-webkit-overflow-scrolling:touch}
.grid{
  display:grid;
  grid-template-columns:minmax(76px,.62fr) repeat(4,minmax(80px,1fr));
  grid-auto-rows:minmax(80px,1fr);
  gap:var(--gap);
  height:100%;min-height:calc(80px * 5 + var(--gap) * 4);
}
.label{
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;
  border-radius:16px;padding:4px;
  background:linear-gradient(180deg,rgba(var(--c),.22),rgba(var(--c),.08));
  border:1px solid rgba(var(--c),.45);
}
.label .emo{font-size:clamp(20px,4.4vh,34px);line-height:1.1}
.label .nm{font-size:clamp(11px,1.9vh,16px);font-weight:700;color:rgb(var(--c));letter-spacing:.02em;white-space:nowrap}
.cell{
  position:relative;overflow:hidden;
  border-radius:16px;
  background:linear-gradient(180deg,rgba(var(--c),.2),rgba(var(--c),.07));
  border:2px solid rgba(var(--c),.42);
  display:flex;align-items:center;justify-content:center;
  transition:transform .09s ease-out,box-shadow .15s ease-out,background-color .15s ease-out;
}
.cell:active{transform:scale(.96)}
.cell .idx{
  position:absolute;top:6px;left:9px;
  font-size:clamp(11px,1.8vh,15px);font-weight:800;color:rgba(255,255,255,.55)
}
.cell .bars{
  display:flex;align-items:flex-end;justify-content:center;
  gap:clamp(2px,.5vw,4px);height:38%;width:100%;padding:0 10px;
}
.cell .bars b{
  display:block;flex:1 1 0;min-width:0;max-width:7px;height:34%;border-radius:3px;
  background:rgba(255,255,255,.22);
}
.cell .bars b.on{height:100%;background:rgba(255,255,255,.72)}
.cell .two{position:absolute;top:6px;right:9px;font-size:clamp(9px,1.5vh,12px);font-weight:800;color:rgba(255,255,255,.5)}
.cell.pending{
  border-style:dashed;border-color:rgba(var(--c),.95);
  background:linear-gradient(180deg,rgba(var(--c),.34),rgba(var(--c),.14));
  animation:blink calc(var(--beat)*2) ease-in-out infinite;
}
.cell.on{
  background:linear-gradient(180deg,rgb(var(--c)),rgba(var(--c),.72));
  border-color:#fff;
  box-shadow:0 0 0 3px rgba(var(--c),.35),0 0 26px rgba(var(--c),.55);
  animation:pulse var(--beat) ease-in-out infinite;
}
.cell.on .idx,.cell.on .two{color:rgba(0,0,0,.5)}
.cell.on .bars b{background:rgba(0,0,0,.25)}
.cell.on .bars b.on{background:rgba(255,255,255,.95)}

/* ---------- 下部 ---------- */
#app.stopped .cell.on{animation:none;filter:saturate(.5) brightness(.62);box-shadow:none}
#panic{
  flex:0 0 auto;width:100%;
  height:clamp(56px,10vh,86px);border-radius:20px;
  background:linear-gradient(180deg,#ff7a7a,#e03e3e);
  border:2px solid #ffb3b3;
  font-size:clamp(19px,3.4vh,28px);font-weight:800;color:#2c0606;
  display:flex;align-items:center;justify-content:center;gap:12px;
  box-shadow:0 8px 22px rgba(224,62,62,.32);
}
#panic:active{transform:scale(.985);filter:brightness(.94)}

/* ---------- スタート画面 ---------- */
#intro{
  position:fixed;inset:0;z-index:50;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:22px;
  padding:24px;text-align:center;
  background:radial-gradient(90% 70% at 50% 30%,#242a63 0%,#0e1024 70%,#070818 100%);
}
#intro h1{margin:0;font-size:clamp(24px,5.4vh,44px);letter-spacing:.06em}
#intro .sub{margin:0;color:var(--muted);font-size:clamp(13px,2.2vh,19px)}
#start{
  min-width:min(78vw,420px);height:clamp(72px,15vh,124px);
  border-radius:26px;
  background:linear-gradient(180deg,#4ff0a8,#17a86c);
  color:#052318;font-size:clamp(26px,5.6vh,44px);font-weight:800;
  box-shadow:0 12px 34px rgba(63,224,151,.34);
  display:flex;align-items:center;justify-content:center;gap:14px;
}
#start:active{transform:scale(.97)}
#start[disabled]{filter:grayscale(.6) brightness(.75);box-shadow:none}
#intro .dots{display:flex;gap:12px}
#intro .dots span{width:16px;height:16px;border-radius:50%;opacity:.9}
#intro .note{color:#ffd166;font-size:clamp(12px,2vh,17px);margin:0}
.hidden{display:none!important}

@keyframes pulse{0%,100%{transform:scale(1);filter:brightness(1)}50%{transform:scale(1.04);filter:brightness(1.18)}}
@keyframes blink{0%,100%{opacity:.5}50%{opacity:1}}
@media (prefers-reduced-motion:reduce){
  .cell.on,.cell.pending,#play.waiting{animation:none}
}
@media (orientation:portrait){
  .grid{grid-template-columns:minmax(66px,.5fr) repeat(4,minmax(80px,1fr))}
  .label .nm{font-size:clamp(10px,1.5vh,13px)}
}
</style>
</head>
<body>

<div id="app" class="hidden" aria-hidden="true">
  <header>
    <button id="play" class="btn" aria-label="再生・停止">▶</button>
    <div class="tempo">
      <span class="ico">🐢</span>
      <input id="bpm" type="range" min="80" max="140" step="1" value="100" aria-label="テンポ">
      <span class="ico">🐇</span>
      <span id="bpmv">100</span>
    </div>
    <div class="beats" id="beats" aria-hidden="true"><i class="one"></i><i></i><i></i><i></i></div>
    <button id="clear" class="btn" aria-label="ぜんぶ消す">🧹</button>
  </header>

  <main>
    <div class="grid" id="grid"></div>
  </main>

  <button id="panic">⏹ ぜんぶ とめる</button>
</div>

<div id="intro">
  <h1>🎵 ループで おんがく</h1>
  <div class="dots">
    <span style="background:#ff6b6b"></span><span style="background:#ffd166"></span><span style="background:#4ecdc4"></span><span style="background:#a78bfa"></span><span style="background:#5ec5ff"></span>
  </div>
  <button id="start" disabled>▶ はじめる</button>
  <p class="sub" id="introMsg">音量とマナーモード（サイレントスイッチ）を確認してね</p>
  <p class="note" id="introErr"></p>
</div>

<script>
(function(){
'use strict';

/* =========================================================
   0. 定数・データ
   ========================================================= */
var TONE_CDNS = [
  'https://cdn.jsdelivr.net/npm/tone@15.1.22/build/Tone.js',
  'https://unpkg.com/tone@15.1.22/build/Tone.js',
  'https://cdnjs.cloudflare.com/ajax/libs/tone/15.1.22/Tone.js'
];

var STEPS_PER_BAR = 16;           // 16分音符 × 16 = 1小節(4/4)
var DEFAULT_BPM = 100;

/* 音はすべて C メジャーペンタトニック (C D E G A) のみ。
   何を重ねても不協和にならない。 */

/* パターン定義: e = [step, note, duration, velocity]
   len は小節数×16 (16 = 1小節 / 32 = 2小節)                */
function P(len, e){ return {len:len, e:e}; }

var TRACKS = [
  {
    id:'drum', name:'ドラム', emoji:'🥁', rgb:'255,107,107',
    patterns:[
      P(16,[[0,'C1','8n',.95],[4,'C1','8n',.9],[8,'C1','8n',.95],[12,'C1','8n',.9]]),
      P(16,[[0,'C1','8n',.95],[6,'C1','8n',.7],[8,'C1','8n',.85],[14,'C1','8n',.65]]),
      P(32,[[0,'C1','8n',.95],[4,'C1','8n',.6],[8,'C1','8n',.9],[12,'C1','8n',.6],
            [16,'C1','8n',.95],[20,'C1','8n',.6],[24,'C1','8n',.9],[28,'G1','16n',.7],[30,'G1','16n',.8]]),
      P(16,[[0,'C1','4n',1],[10,'C1','8n',.6]])
    ]
  },
  {
    id:'hat', name:'ハイハット', emoji:'✨', rgb:'255,209,102',
    patterns:[
      P(16,[[0,null,'16n',.55],[2,null,'16n',.35],[4,null,'16n',.55],[6,null,'16n',.35],
            [8,null,'16n',.55],[10,null,'16n',.35],[12,null,'16n',.55],[14,null,'16n',.35]]),
      P(16,[[0,null,'32n',.5],[1,null,'32n',.25],[2,null,'32n',.35],[3,null,'32n',.25],
            [4,null,'32n',.5],[5,null,'32n',.25],[6,null,'32n',.35],[7,null,'32n',.25],
            [8,null,'32n',.5],[9,null,'32n',.25],[10,null,'32n',.35],[11,null,'32n',.25],
            [12,null,'32n',.5],[13,null,'32n',.25],[14,null,'32n',.35],[15,null,'32n',.25]]),
      P(16,[[2,null,'16n',.6],[6,null,'16n',.6],[10,null,'16n',.6],[14,null,'16n',.6]]),
      P(32,[[0,null,'16n',.55],[3,null,'32n',.3],[6,null,'16n',.45],[8,null,'16n',.55],[11,null,'32n',.3],[14,null,'16n',.45],
            [16,null,'16n',.55],[19,null,'32n',.3],[22,null,'16n',.45],[24,null,'16n',.55],[27,null,'32n',.3],[29,null,'32n',.3],[30,null,'32n',.4]])
    ]
  },
  {
    id:'bass', name:'ベース', emoji:'🎸', rgb:'78,205,196',
    patterns:[
      P(16,[[0,'C2','2n',.85],[8,'G2','2n',.8]]),
      P(16,[[0,'C2','8n',.9],[4,'C2','8n',.7],[6,'G2','8n',.75],[8,'C2','8n',.85],[12,'A2','8n',.75],[14,'G2','8n',.7]]),
      P(32,[[0,'C2','4n',.85],[4,'G2','4n',.75],[8,'A2','4n',.8],[12,'G2','4n',.7],
            [16,'E2','4n',.8],[20,'G2','4n',.75],[24,'D2','4n',.8],[28,'C2','4n',.85]]),
      P(16,[[0,'C2','2n',.9],[8,'G1','2n',.8]])
    ]
  },
  {
    id:'chord', name:'コード', emoji:'🎹', rgb:'167,139,250',
    patterns:[
      P(16,[[0,['C4','E4','G4'],'1n',.55]]),
      P(32,[[0,['C4','E4','G4'],'1n',.55],[16,['D4','G4','A4'],'1n',.55]]),
      P(16,[[2,['E4','G4','C5'],'8n',.5],[6,['E4','G4','C5'],'8n',.45],[10,['D4','G4','A4'],'8n',.5],[14,['D4','G4','A4'],'8n',.45]]),
      P(32,[[0,['A3','C4','E4'],'2n',.5],[8,['G3','C4','D4'],'2n',.5],
            [16,['C4','E4','G4'],'2n',.55],[24,['D4','G4','A4'],'2n',.5]])
    ]
  },
  {
    id:'melo', name:'メロディ', emoji:'🎵', rgb:'94,197,255',
    patterns:[
      P(16,[[0,'C5','8n',.7],[4,'D5','8n',.65],[8,'E5','8n',.7],[12,'G5','8n',.65]]),
      P(32,[[0,'G4','8n',.7],[2,'A4','8n',.6],[4,'C5','8n',.7],[6,'D5','8n',.6],[8,'E5','4n',.72],[12,'C5','8n',.6],
            [16,'D5','8n',.7],[18,'C5','8n',.6],[20,'A4','8n',.65],[24,'G4','4n',.7],[28,'A4','8n',.6]]),
      P(16,[[0,'G5','16n',.55],[6,'A5','16n',.5],[8,'E5','16n',.55],[10,'G5','16n',.5],[14,'D5','16n',.5]]),
      P(16,[[0,'C5','16n',.6],[2,'D5','16n',.55],[4,'E5','16n',.6],[6,'G5','16n',.55],
            [8,'A5','16n',.6],[10,'G5','16n',.55],[12,'E5','16n',.6],[14,'D5','16n',.55]])
    ]
  }
];

/* パターンを step -> events のテーブルに展開 */
TRACKS.forEach(function(tr){
  tr.patterns.forEach(function(p){
    p.map = new Array(p.len);
    p.e.forEach(function(ev){
      var s = ev[0];
      (p.map[s] || (p.map[s] = [])).push({n:ev[1], d:ev[2], v:ev[3]});
    });
  });
});

/* =========================================================
   1. 状態
   ========================================================= */
var state = TRACKS.map(function(){
  return {active:-1, startStep:0, pending:undefined}; // pending: undefined=なし / -1=止める / 0..3=鳴らす
});
var running = false;         // Transportが動いているか
var stopPending = false;     // 次の小節頭で止める予約
var globalStep = 0;          // 再生開始からの16分音符カウント
var Tone, Transport, Draw;
var audio = {};
var cellEls = [];            // cellEls[track][pattern]

/* =========================================================
   2. DOM 構築
   ========================================================= */
var grid = document.getElementById('grid');
TRACKS.forEach(function(tr, ti){
  var label = document.createElement('div');
  label.className = 'label';
  label.style.setProperty('--c', tr.rgb);
  label.innerHTML = '<span class="emo">' + tr.emoji + '</span><span class="nm">' + tr.name + '</span>';
  grid.appendChild(label);

  cellEls[ti] = [];
  tr.patterns.forEach(function(p, pi){
    var b = document.createElement('button');
    b.className = 'cell';
    b.style.setProperty('--c', tr.rgb);
    b.setAttribute('aria-label', tr.name + ' ループ' + (pi + 1));

    var bars = '';
    for (var s = 0; s < STEPS_PER_BAR; s++){
      bars += '<b class="' + (p.map[s] ? 'on' : '') + '"></b>';
    }
    b.innerHTML = '<span class="idx">' + (pi + 1) + '</span>' +
                  (p.len > STEPS_PER_BAR ? '<span class="two">2</span>' : '') +
                  '<span class="bars">' + bars + '</span>';

    b.addEventListener('pointerdown', function(ev){
      ev.preventDefault();
      onCellTap(ti, pi);
    });
    grid.appendChild(b);
    cellEls[ti][pi] = b;
  });
});

var appEl = document.getElementById('app');
var beatEls = Array.prototype.slice.call(document.getElementById('beats').children);
var playBtn = document.getElementById('play');
var bpmInput = document.getElementById('bpm');
var bpmView = document.getElementById('bpmv');

/* =========================================================
   3. 表示更新
   ========================================================= */
function render(){
  for (var ti = 0; ti < state.length; ti++){
    var st = state[ti];
    for (var pi = 0; pi < cellEls[ti].length; pi++){
      var el = cellEls[ti][pi];
      var on = (st.active === pi);
      var pend = (st.pending !== undefined) && (st.pending === pi);
      el.classList.toggle('on', on);
      el.classList.toggle('pending', pend);
    }
  }
  appEl.classList.toggle('stopped', !running);
  playBtn.textContent = running ? '■' : '▶';
  playBtn.classList.toggle('playing', running);
  playBtn.classList.toggle('waiting', stopPending);
}

function showBeat(step){
  var b = Math.floor((step % STEPS_PER_BAR) / 4);
  for (var i = 0; i < beatEls.length; i++){
    beatEls[i].classList.toggle('hit', i === b);
  }
}
function clearBeat(){
  beatEls.forEach(function(el){ el.classList.remove('hit'); });
}

/* =========================================================
   4. 音づくり（Tone.js 内蔵シンセのみ）
   ========================================================= */
function buildAudio(){
  var limiter = new Tone.Limiter(-1).toDestination();
  var bus = new Tone.Compressor({threshold:-16, ratio:3, attack:.005, release:.12}).connect(limiter);
  var reverb = new Tone.Reverb({decay:1.8, wet:.16}).connect(bus);

  audio.drum = new Tone.MembraneSynth({
    pitchDecay:.045, octaves:6,
    oscillator:{type:'sine'},
    envelope:{attack:.001, decay:.42, sustain:0, release:.35}
  }).connect(bus);
  audio.drum.volume.value = -7;

  audio.hat = new Tone.NoiseSynth({
    noise:{type:'white'},
    envelope:{attack:.001, decay:.045, sustain:0, release:.02}
  }).connect(bus);
  audio.hat.volume.value = -20;

  audio.bass = new Tone.FMSynth({
    harmonicity:1.5, modulationIndex:6,
    oscillator:{type:'sine'}, modulation:{type:'square'},
    envelope:{attack:.012, decay:.22, sustain:.55, release:.25},
    modulationEnvelope:{attack:.01, decay:.18, sustain:0, release:.1}
  }).connect(bus);
  audio.bass.volume.value = -7;

  audio.chord = new Tone.PolySynth(Tone.Synth, {
    oscillator:{type:'triangle'},
    envelope:{attack:.08, decay:.35, sustain:.35, release:.9}
  }).connect(reverb);
  audio.chord.volume.value = -17;

  audio.melo = new Tone.Synth({
    oscillator:{type:'triangle'},
    envelope:{attack:.008, decay:.18, sustain:.22, release:.4}
  }).connect(reverb);
  audio.melo.volume.value = -11;

  audio.reverb = reverb;
}

function playEvent(id, ev, time){
  var v = (ev.v === undefined) ? .8 : ev.v;
  if (id === 'hat'){ audio.hat.triggerAttackRelease(ev.d, time, v); return; }
  audio[id].triggerAttackRelease(ev.n, ev.d, time, v);
}

/* =========================================================
   5. 予約の反映（すべて小節の頭で）
   ========================================================= */
function flushPending(){
  for (var i = 0; i < state.length; i++){
    var st = state[i];
    if (st.pending !== undefined){
      st.active = st.pending;
      st.startStep = globalStep;   // ループはその小節の頭から
      st.pending = undefined;
    }
  }
}

/* 16分音符ごとのメインループ */
function tick(time){
  if (!running) return;
  var step = globalStep;

  if (step % STEPS_PER_BAR === 0){
    // 小節の頭：予約を反映（scheduleOnce("@1m") と同時刻。どちらが先でも同じ結果になる）
    if (stopPending){ doStop(time); return; }
    flushPending();
    Draw.schedule(render, time);
  }

  for (var ti = 0; ti < TRACKS.length; ti++){
    var st = state[ti];
    if (st.active < 0) continue;
    var pat = TRACKS[ti].patterns[st.active];
    var local = (step - st.startStep) % pat.len;
    if (local < 0) local += pat.len;
    var evs = pat.map[local];
    if (!evs) continue;
    for (var k = 0; k < evs.length; k++){
      try { playEvent(TRACKS[ti].id, evs[k], time); } catch(e){}
    }
  }

  Draw.schedule(function(){ showBeat(step); }, time);
  globalStep++;
}

/* =========================================================
   6. 再生 / 停止
   ========================================================= */
function doStart(){
  if (running) return;
  stopPending = false;
  globalStep = 0;
  for (var i = 0; i < state.length; i++){ state[i].startStep = 0; }
  running = true;
  Transport.stop();
  Transport.position = 0;
  Transport.start('+0.06');
  render();
}

function doStop(time){
  if (!running) return;
  running = false;
  stopPending = false;
  Transport.stop(time);
  try { audio.chord.releaseAll(); } catch(e){}
  globalStep = 0;
  for (var i = 0; i < state.length; i++){
    state[i].startStep = 0;
    state[i].pending = undefined;
  }
  if (time !== undefined && Draw){
    Draw.schedule(function(){ clearBeat(); render(); }, time);
  } else {
    clearBeat(); render();
  }
}

/* 次の小節頭に予約する（クオンタイズの中心） */
function scheduleAtNextBar(){
  // "@1m" = 次の小節の頭。連打してもリズムが崩れない。
  Transport.scheduleOnce(function(time){
    if (!running) return;
    if (stopPending){ doStop(time); return; }
    flushPending();
    Draw.schedule(render, time);
  }, '@1m');
}

/* =========================================================
   7. 操作
   ========================================================= */
function onCellTap(ti, pi){
  var st = state[ti];
  var current = (st.pending !== undefined) ? st.pending : st.active;
  var next = (current === pi) ? -1 : pi;   // 同じトラック内では1つだけON（横方向は排他）

  if (!running){
    // 止まっているときは、押した内容をセットしてすぐ走り出す
    st.pending = undefined;
    st.active = next;
    doStart();
    return;
  }
  st.pending = (next === st.active) ? undefined : next;
  scheduleAtNextBar();
  render();
}

playBtn.addEventListener('pointerdown', function(e){
  e.preventDefault();
  if (!running){ doStart(); return; }
  if (stopPending){ doStop(); return; }   // もう一度押したらすぐ止まる
  stopPending = true;
  scheduleAtNextBar();
  render();
});

document.getElementById('clear').addEventListener('pointerdown', function(e){
  e.preventDefault();
  if (!running){
    for (var i = 0; i < state.length; i++){ state[i].active = -1; state[i].pending = undefined; }
    render();
    return;
  }
  for (var j = 0; j < state.length; j++){
    state[j].pending = (state[j].active === -1) ? undefined : -1;
  }
  scheduleAtNextBar();
  render();
});

document.getElementById('panic').addEventListener('pointerdown', function(e){
  e.preventDefault();
  for (var i = 0; i < state.length; i++){ state[i].active = -1; state[i].pending = undefined; }
  doStop();
});

bpmInput.addEventListener('input', function(){
  var v = parseInt(bpmInput.value, 10);
  bpmView.textContent = v;
  document.documentElement.style.setProperty('--beat', (60 / v).toFixed(3) + 's');
  if (Transport) Transport.bpm.value = v;
});

/* ダブルタップ拡大・ピンチ・スクロールを抑止 */
document.addEventListener('gesturestart', function(e){ e.preventDefault(); });
document.addEventListener('dblclick', function(e){ e.preventDefault(); });
document.addEventListener('touchmove', function(e){
  if (e.touches.length > 1) e.preventDefault();
}, {passive:false});

/* =========================================================
   8. 起動フロー
   ========================================================= */
var introEl = document.getElementById('intro');
var startBtn = document.getElementById('start');
var introErr = document.getElementById('introErr');

function loadScript(src){
  return new Promise(function(res, rej){
    var s = document.createElement('script');
    s.src = src;
    s.crossOrigin = 'anonymous';
    s.onload = function(){ res(); };
    s.onerror = function(){ rej(new Error(src)); };
    document.head.appendChild(s);
  });
}

function loadTone(){
  if (window.Tone) return Promise.resolve(true);   // 埋め込み版などで既に読み込み済みの場合
  var i = 0;
  function next(){
    if (i >= TONE_CDNS.length) return Promise.reject(new Error('tone'));
    var url = TONE_CDNS[i++];
    return loadScript(url).then(function(){
      if (window.Tone) return true;
      return next();
    }, next);
  }
  return next();
}

loadTone().then(function(){
  startBtn.disabled = false;
}, function(){
  introErr.textContent = '音のプログラムを読み込めませんでした。ネットにつないで開き直してね。';
});

startBtn.addEventListener('click', function(){
  if (startBtn.disabled) return;
  startBtn.disabled = true;
  startBtn.textContent = '⏳ じゅんび…';

  Promise.resolve()
    .then(function(){ return window.Tone.start(); })
    .then(function(){
      Tone = window.Tone;
      Transport = Tone.getTransport ? Tone.getTransport() : Tone.Transport;
      Draw = Tone.getDraw ? Tone.getDraw() : Tone.Draw;

      buildAudio();
      Transport.bpm.value = parseInt(bpmInput.value, 10) || DEFAULT_BPM;
      Transport.scheduleRepeat(tick, '16n', 0);

      document.documentElement.style.setProperty('--beat', (60 / Transport.bpm.value).toFixed(3) + 's');

      introEl.classList.add('hidden');
      appEl.classList.remove('hidden');
      appEl.setAttribute('aria-hidden', 'false');
      render();

      doStart();   // 拍を刻んで待つ。セルを押すと次の小節から鳴りはじめる。

      if (audio.reverb && audio.reverb.ready) audio.reverb.ready.catch(function(){});
    })
    .catch(function(err){
      startBtn.disabled = false;
      startBtn.textContent = '▶ はじめる';
      introErr.textContent = '音を出せませんでした。もう一度タップしてね。';
      if (window.console) console.error(err);
    });
});

/* PWA */
if ('serviceWorker' in navigator){
  window.addEventListener('load', function(){
    navigator.serviceWorker.register('./sw.js').catch(function(){});
  });
}
})();
</script>
